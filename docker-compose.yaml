services:
  backend:
    container_name: code-runner-backend

    build:
      context: .
      target: main

  worker:
    container_name: code-runner-worker

    build:
      context: .
      target: worker
    cap_add:
      - SYS_ADMIN

    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

    cgroup: host

    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
