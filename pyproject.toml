pydantic-core = "2.46.4"
pygments = "2.20.0"
python-dotenv = "1.2.2"
rich = "15.0.0"
shellingham = "1.5.4"
sqlalchemy = "2.0.49"
starlette = "1.0.1"
typer = "0.25.1"
