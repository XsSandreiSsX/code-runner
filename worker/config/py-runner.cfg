name: "Python Runner Config"

log_level: ERROR

mode: ONCE
hostname: "PYTHON-JAIL"

cwd: "/workspace"

max_cpus: 1
nice_level: 0

keep_caps: false
silent: false
skip_setsid: false
stderr_to_null: false
disable_no_new_privs: false
forward_signals: false
disable_tsc: false

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

use_cgroupv2: true

keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "LANG=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "LD_LIBRARY_PATH=/usr/local/lib:/usr/lib:/lib"

uidmap {
    inside_id: "0"
    outside_id: "1000"
    count: 1
}

gidmap {
    inside_id: "0"
    outside_id: "1000"
    count: 1
}

rlimit_core: 0
rlimit_core_type: VALUE

rlimit_fsize: 16
rlimit_fsize_type: VALUE

rlimit_nofile: 32
rlimit_nofile_type: VALUE

rlimit_nproc: 16
rlimit_nproc_type: VALUE

rlimit_stack: 64
rlimit_stack_type: VALUE


cgroup_pids_max: 16

cgroup_mem_swap_max: 0

mount {
    src: "/app/sandbox/rootfs"
    dst: "/"
    is_bind: true
    rw: false

    nosuid: true
    nodev: true
}

mount_proc: false

mount {
    dst: "/proc"
    fstype: "tmpfs"
    options: "size=2048k,mode=0755"
    rw: true

    nosuid: true
    nodev: true
    noexec: true
}